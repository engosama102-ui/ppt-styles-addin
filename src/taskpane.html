<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير أنماط PowerPoint</title>
    
    <!-- Office.js Library -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 0.9em;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-secondary {
            background: #a0aec0;
            color: white;
        }

        .btn-secondary:hover {
            background: #718096;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .styles-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .style-item {
            background: #f7fafc;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .style-item:hover {
            border-color: #667eea;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.15);
        }

        .style-item h3 {
            color: #2d3748;
            margin-bottom: 6px;
            font-size: 1em;
        }

        .style-preview {
            padding: 8px;
            background: white;
            border-radius: 4px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            font-size: 0.9em;
        }

        .style-details {
            font-size: 0.8em;
            color: #718096;
            margin-bottom: 8px;
        }

        .style-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .style-actions .btn {
            font-size: 0.8em;
            padding: 6px 10px;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: 500;
            font-size: 0.9em;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #48bb78;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #f56565;
        }

        .alert-info {
            background: #bee3f8;
            color: #2c5282;
            border: 2px solid #4299e1;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-wrapper input[type="color"] {
            width: 50px;
            height: 35px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .color-picker-wrapper input[type="text"] {
            flex: 1;
        }

        .export-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 30px;
            font-size: 0.9em;
        }

        /* Scrollbar styling */
        .styles-list::-webkit-scrollbar {
            width: 8px;
        }

        .styles-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .styles-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .styles-list::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 مدير أنماط PowerPoint</h1>
            <p>احفظ وطبق أنماط النص مباشرة</p>
        </div>

        <div id="alertContainer"></div>

        <!-- Create/Edit Panel -->
        <div class="panel">
            <h2>✏️ إنشاء نمط جديد</h2>
            
            <div class="form-group">
                <label>اسم النمط</label>
                <input type="text" id="styleName" placeholder="مثال: عنوان رئيسي">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>نوع الخط</label>
                    <select id="fontName">
                        <option value="Arial">Arial</option>
                        <option value="Calibri">Calibri</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Cairo">Cairo</option>
                        <option value="Dubai">Dubai</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>حجم الخط</label>
                    <input type="number" id="fontSize" value="16" min="8" max="96">
                </div>
            </div>

            <div class="form-group">
                <label>لون النص</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="fontColor" value="#000000">
                    <input type="text" id="fontColorHex" value="#000000" placeholder="#000000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>غامق</label>
                    <select id="fontBold">
                        <option value="false">لا</option>
                        <option value="true">نعم</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>مائل</label>
                    <select id="fontItalic">
                        <option value="false">لا</option>
                        <option value="true">نعم</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>تسطير</label>
                    <select id="fontUnderline">
                        <option value="false">لا</option>
                        <option value="true">نعم</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>المحاذاة</label>
                    <select id="textAlign">
                        <option value="Right">يمين</option>
                        <option value="Left">يسار</option>
                        <option value="Center">وسط</option>
                        <option value="Justify">ضبط</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>معاينة النمط</label>
                <div id="stylePreview" class="style-preview">
                    نص تجريبي للمعاينة
                </div>
            </div>

            <button class="btn btn-success" onclick="captureStyle()">📥 استيراد من النص المحدد</button>
            <button class="btn btn-primary" onclick="saveStyle()">💾 حفظ النمط</button>
        </div>

        <!-- Saved Styles Panel -->
        <div class="panel">
            <h2>📚 الأنماط المحفوظة</h2>
            <div id="stylesList" class="styles-list">
                <div class="empty-state">
                    لا توجد أنماط محفوظة<br>
                    ابدأ بإنشاء نمط جديد!
                </div>
            </div>

            <div class="export-buttons">
                <button class="btn btn-secondary" onclick="exportStyles()">📤 تصدير</button>
                <button class="btn btn-secondary" onclick="importStyles()">📥 استيراد</button>
            </div>
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImport(event)">
        </div>
    </div>

    <script src="taskpane.js"></script>
</body>
</html>
